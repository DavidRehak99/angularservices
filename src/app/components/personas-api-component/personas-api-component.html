
<h1 style="color:rgb(104, 50, 230)">Personas API</h1>
@for(person of personas; track person){
    <table style="border: 1px solid black;">


     <tr style="color:darkblue">
     Nombre: {{person.Nombre}}</tr>
     <tr style="color:darkblue">
      Edad: {{person.Edad}}</tr>
   <tr style="color:blueviolet">
    Email: {{person.Email}}</tr>
    
  
</table>

    

}
